
server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: credit-application-service
    
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/coopcredit}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update       # Use Flyway for migrationsi ya tienes el esquema preparado
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Flyway configuration
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: true


  jackson:
    serialization:
      INDENT_OUTPUT: true
    default-property-inclusion: non_null

# Application Security Configuration
application:
  security:
    jwt:
      secret-key: ${JWT_SECRET:bXlTZWNyZXRLZXlGb3JKV1RUb2tlbkdlbmVyYXRpb25NdXN0QmVMb25nRW5vdWdoRm9ySFMyNTZBbGdvcml0aG1Ub1dvcms=}
      expiration: ${JWT_EXPIRATION:86400000}   # 24 hours in milliseconds
      refresh-token:
        expiration: ${JWT_REFRESH_EXPIRATION:604800000}  # 7 days in milliseconds

# JWT Configuration (legacy, keeping for compatibility)
jwt:
  secret: ${JWT_SECRET:mySecretKeyForJWTTokenGenerationMustBeLongEnoughForHS256AlgorithmToWork}
  expiration: ${JWT_EXPIRATION:86400000}   # 24 hours in milliseconds
  issuer: ${JWT_ISSUER:credit-application-service}
  header: "Authorization"
  prefix: "Bearer "

# Security
security:
  enabled: true

# Risk Service Configuration
risk-service:
  base-url: ${RISK_SERVICE_URL:http://localhost:8081}
  timeout: ${RISK_SERVICE_TIMEOUT:5000}  # 5 seconds
  retry:
    max-attempts: ${RISK_SERVICE_RETRY_MAX_ATTEMPTS:3}
    backoff-delay: ${RISK_SERVICE_RETRY_BACKOFF:1000}  # 1 second

# Spring Boot Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
    metrics:
      enabled: true
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  prometheus:
    metrics:
      export:
        enabled: true

# Logging Configuration
logging:
  level:
    root: INFO
    com.coopcredit.credit.application_service: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.springframework.security: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# SpringDoc OpenAPI Configuration
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
  show-actuator: true

# Resilience4j Configuration
resilience4j:
  retry:
    instances:
      riskService:
        max-attempts: ${risk-service.retry.max-attempts}
        wait-duration: ${risk-service.retry.backoff-delay}ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - org.springframework.web.reactive.function.client.WebClientRequestException
          - java.util.concurrent.TimeoutException
          - java.io.IOException
